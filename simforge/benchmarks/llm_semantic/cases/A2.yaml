id: A2
family: A_PARAPHRASE
title: Informal plant engineer
purpose: Same process, colloquial words, '1 minute', 'shelf' for buffer.
text: 'Mira, la cosa va así: piezas nunca nos faltan. Un chaval monta cada pieza a mano y le lleva un minuto justo. Lo que
  monta lo deja en una estantería donde caben 5. De ahí la coge la máquina, que tarda 45 segundos con cada una. Al final el
  mismo chaval revisa cada pieza, unos 20 segundos. Quiero ver qué pasa en un turno de 8 horas.'
