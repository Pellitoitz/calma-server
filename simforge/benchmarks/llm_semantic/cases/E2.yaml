id: E2
family: E_UNSUPPORTED_RULE
title: Review batching threshold
purpose: Review only with >= 2 racks waiting.
text: Hay 4 bastidores. Un operario monta cada bastidor en 120 s. Los bastidores montados esperan en un buffer de 3 antes
  de la selectiva, que tarda 30 s por bastidor. Después el mismo operario revisa el bastidor en 60 s y el bastidor vuelve
  libre al montaje. Material ilimitado; simular 8 horas. El operario solo empieza a revisar cuando hay al menos dos bastidores
  esperando revisión; mientras tanto sigue montando.
